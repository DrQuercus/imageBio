# Gives Caddy the secret it presents to imageBio:
# /etc/systemd/system/caddy.service.d/imagebio.conf, then systemctl daemon-reload && systemctl restart caddy
# /etc/imagebio/proxy.env holds IMAGEBIO_PROXY_SECRET=<the same value as in imagebio.env>
# and belongs to root (chmod 600): systemd reads it before Caddy drops its privileges.

[Service]
EnvironmentFile=/etc/imagebio/proxy.env
