# Single sign-on: Caddy -> oauth2-proxy (OpenID Connect) -> imageBio. Added to the base file:
#
#     docker compose -f docker-compose.yml -f docker-compose.sso.yml up -d
#
# or once and for all with COMPOSE_FILE in .env (see env.example).
#
# NOT RUN in the session that wrote it, and the documentation of oauth2-proxy could not be
# reached from there: check the option names against the release you install.
# After installing, do the forged-identity check of docs/exploitation.md.

services:
  caddy:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.sso", "--adapter", "caddyfile"]
    depends_on: [oauth2-proxy]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_VERSION:-v7.8.1}
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"          # it is itself behind Caddy
      OAUTH2_PROXY_UPSTREAMS: http://imagebio:8000
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?the address of the OpenID Connect provider}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      OAUTH2_PROXY_REDIRECT_URL: https://${IMAGEBIO_HOST}/oauth2/callback
      OAUTH2_PROXY_SCOPE: ${OIDC_SCOPE:-openid email profile}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"             # who may enter is the provider's decision
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?generate one, see env.example}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # the identity of the user goes to imageBio in X-Forwarded-User, -Email and -Groups
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      # the health check is open, as it is in imageBio
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: GET=^/healthz$$
    networks: [edge, app]
    depends_on: [imagebio]
