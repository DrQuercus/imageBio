[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagebio"
version = "0.1.0"
description = "Network-deployed scientific image viewer/editor with cryo-EM tools (backend)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "mrcfile>=1.5",
    "tifffile>=2025.5.10",
    "imagecodecs>=2025.11.11",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "psutil>=5.9",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
imagebio = "imagebio.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imagebio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
timeout = 120
markers = [
    "perf: performance budgets (run with -m perf; excluded from the default run)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",    # assert is fine in tests and for internal invariants
    "RUF001", "RUF002", "RUF003",  # Å, µ and × are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]  # tables of test cases read better on one line

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["imagebio"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mrcfile.*", "tifffile.*", "imagecodecs.*", "zstandard.*", "PIL.*"]
ignore_missing_imports = true
